version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: epharma_sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epharma_web
    restart: always
    ports:
      - "8080:80"
    environment:
      - DB_SERVER=sqlserver
      - DB_NAME=${DB_NAME:-ePharmaDB}
      - DB_USER=sa
      - DB_PASSWORD=${MSSQL_SA_PASSWORD:-Password123!}
    depends_on:
      - sqlserver

volumes:
  mssql_data:
